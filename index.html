  if(m.v&&typeof pxBadge=='function'){const b=document.createElement('b');b.dataset.pxi=i;b.style.cssText='position:absolute;top:4px;right:4px;font-size:10px;padding:1px 6px;border-radius:8px;background:#000b;cursor:pointer;font-weight:600';b.onclick=ev=>{ev.stopPropagation();pxBadge(m)};d.append(b)}
  wire(d,m,i);P.append(d)});
 if(typeof pxUI=='function')try{pxUI()}catch(e){}if(typeof smOpts=='function')try{smOpts()}catch(e){}const es=document.getElementById('e_src');es&&es.dispatchEvent(new Event('refill'))};
function wire(e,m,i){e.draggable=true;e.ondragstart=ev=>ev.dataTransfer.setData('text/plain','m'+i);e.onclick=()=>add(i);e.ondblclick=ev=>{ev.preventDefault();inspect(m)};e.oncontextmenu=ev=>{ev.preventDefault();menuAt(m,ev.clientX,ev.clientY)}}
/* usage counter follows timeline edits */
const _tl=tl;tl=function(...a){const r=_tl(...a);clearTimeout(tl._t);tl._t=setTimeout(()=>{if(document.getElementById('mpp'))pool()},250);return r};

<script>

(()=>{
const st=document.createElement('style');
st.textContent=`#cutbar{display:none;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:8px}
body[data-p=cut] #cutbar{display:flex}body[data-p=cut] #view canvas#cv{max-height:calc(100% - 108px)}

bar.innerHTML=TB.map(([k,l,h])=>`<button class="btn big" data-tool="${k}">${l}<small>${h}</small></button>`).join('')+
 `<span class="sep"></span><button class="btn big" id="tp">Source Tape<small>J K L</small></button><button class="btn" id="tpp" title="Previous clip">⏮</button><span id="tpn">—</span><button class="btn" id="tpx" title="Next clip">⏭</button>
 <span class="sep"></span><button class="btn big" id="sbb">Sync Bin<small>by audio</small></button>`;
const view=document.getElementById('view');view.querySelector('.ctl').after(bar);
const sbp=document.createElement('div');sbp.id='sbp';bar.after(sbp);
/* trim buttons */
bar.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const k=b.dataset.tool;
 if(k=='sel'){tool='sel';window.kmSetTrimEdge&&window.kmSetTrimEdge(null);mode();tl()}else if(k=='razor'){tool=tool=='razor'?'sel':'razor';mode();tl()}else{tool=k;mode();tl()}ref()});
function ref(){bar.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('pri',tool==b.dataset.tool));
 document.getElementById('tp').classList.toggle('pri',!!TP.on)}
const _mode=mode;mode=function(){_mode();ref()};
/* Source Tape: temporarily lay the whole pool end to end so J/K/L shuttles through every source clip */
const TP={on:false,bak:null,segs:[]};
function tapeOn(){const L=media.filter(m=>m.v||m.img||m.c||m.a);if(!L.length){toast('No clips in the pool');return}
 TP.bak={clips,t,tool,sel};TP.segs=[];let s=0,sa=0;const nc=[];
 L.forEach(m=>{const d=Math.max(.5,m.dur||5);if(m.a){nc.push({id:uid++,m,tr:nV,st:sa,d,off:0,fx:{...FX}});sa+=d}
  else{nc.push({id:uid++,m,tr:nV-1,st:s,d,off:0,fx:{...FX}});TP.segs.push({m,st:s,d});s+=d}});
 clips=nc;sel=null;t=0;TP.on=true;tool='sel';mode();tl();fxui();draw();ref();info()}
function tapeOff(){if(!TP.on)return;const b=TP.bak;clips=b.clips;t=b.t;sel=b.sel;TP.on=false;TP.bak=null;mode();tl();fxui();draw();ref();info()}
function info(){const n=document.getElementById('tpn');if(!TP.on){n.textContent='—';return}
 const i=TP.segs.findIndex(s=>t>=s.st&&t<s.st+s.d-1e-6);n.textContent=i<0?'end':(i+1)+'/'+TP.segs.length+' · '+TP.segs[i].m.n}
document.getElementById('tp').onclick=()=>TP.on?tapeOff():tapeOn();
const jump=d=>{if(!TP.on)return;const i=TP.segs.findIndex(s=>t>=s.st&&t<s.st+s.d-1e-6);let j=i<0?TP.segs.length-1:i+d;
 if(d<0&&i>=0&&t-TP.segs[i].st>.3)j=i;j=Math.max(0,Math.min(TP.segs.length-1,j));t=TP.segs[j].st;draw();info()};
document.getElementById('tpp').onclick=()=>jump(-1);document.getElementById('tpx').onclick=()=>jump(1);
setInterval(()=>{if(TP.on)info()},200);
addEventListener('keydown',e=>{if(e.key=='Escape'&&TP.on&&!document.getElementById('mcd'))tapeOff()});
/* Sync Bin */
function sbRender(){const vs=media.filter(m=>m.v&&m.dur),G=(window.kirscheMulticam&&window.kirscheMulticam.state.g)||[];
 sbp.innerHTML=`<div style="margin-bottom:6px;color:var(--mu,#999)">Cameras in the pool: ${vs.length}. Audio sync needs at least 2 videos.</div>`+
 (vs.length?vs.map(m=>`<div style="padding:2px 0">🎥 ${m.n} <small style="color:var(--mu,#999)">${m.dur.toFixed(1)}s · ${(G.filter(g=>g.angles.some(a=>a.m===m)).length)} group(s)</small></div>`).join(''):'<div>Import videos from different cameras.</div>')+
 (G.length?'<div style="margin:8px 0 4px;font-weight:600">Multicam groups</div>'+G.map((g,i)=>`<div style="padding:2px 0"><a href="#" data-g="${i}" style="color:var(--ac,#e8613a)">${g.name}</a> <small>${g.angles.length} angles.</small></div>`).join(''):'')+
 `<div style="margin-top:8px;text-align:right"><button class="btn pri" id="sbgo">Sync…</button></div>`;
 sbp.querySelector('#sbgo').onclick=()=>{sbp.style.display='none';window.kirscheMulticam&&window.kirscheMulticam.dialog()};
 sbp.querySelectorAll('[data-g]').forEach(a=>a.onclick=e=>{e.preventDefault();window.kirscheMulticam.open(G[+a.dataset.g])})}
document.getElementById('sbb').onclick=()=>{const o=sbp.style.display=='block';sbp.style.display=o?'none':'block';if(!o)sbRender()};
ref();
})();
</script>

<script>
/* ===== Color: Timeline Grade · Shot Match · Auto Color ===== */
(()=>{
const Q=s=>document.querySelector(s),LK='km-tg',DEF={on:true,b:100,c:100,s:100,h:0,w:0,gr:0};
let TG={...DEF},ref=null,T=null,Tx=null;
try{Object.assign(TG,JSON.parse(localStorage.getItem(LK)||'{}'))}catch(x){}
const sv=()=>{try{localStorage.setItem(LK,JSON.stringify(TG))}catch(x){}try{faDirty()}catch(x){}};
/* Timeline Grade is stored in the project (field tg); localStorage is only the default value for a new project */
window.__tgPack=()=>({...TG});
window.__tgLoad=o=>{if(!o||typeof o!='object')return;const n={...DEF};if(typeof o.on=='boolean')n.on=o.on;for(const k of['b','c','s','h','w','gr'])if(Number.isFinite(+o[k]))n[k]=+o[k];TG=n;try{localStorage.setItem(LK,JSON.stringify(TG))}catch(x){}try{sync()}catch(x){}try{draw()}catch(x){}};
const dirty=()=>['b','c','s','h','w','gr'].some(k=>TG[k]!=DEF[k]);
/* --- Timeline Grade: a post-pass over the finished composite (preview and export both go through draw) --- */
function pass(){if(!TG.on||!dirty())return;const w=cv.width,h=cv.height;
 if(!T||T.width!=w||T.height!=h){T=document.createElement('canvas');T.width=w;T.height=h;Tx=T.getContext('2d')}
 Tx.clearRect(0,0,w,h);Tx.drawImage(cv,0,0);g.save();g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.shadowBlur=0;g.globalCompositeOperation='copy';g.filter=filt({...FX,...TG});g.drawImage(T,0,0);g.restore()}
const _d=draw;draw=function(){_d.apply(this,arguments);pass()};
/* --- frame sampler + statistics --- */
const sc=document.createElement('canvas');sc.width=64;sc.height=36;const sx=sc.getContext('2d',{willReadFrequently:true});
const wt=(f,ms=8000)=>new Promise((r,j)=>{f(r);setTimeout(()=>j(new Error('timeout')),ms)});
async function frame(c,graded){const m=c.m;let v=null,src=m.img;
 if(!src&&m.v){v=document.createElement('video');v.muted=true;v.preload='auto';v.src=m.v.currentSrc||m.v.src;await wt(r=>v.onloadeddata=r);
  v.currentTime=Math.max(0,Math.min((c.off||0)+c.d*(c.sp||1)/2,(v.duration||1)-.05));await wt(r=>v.onseeked=r);src=v}
 if(!src)return null;sx.filter='none';sx.fillStyle='#000';sx.fillRect(0,0,64,36);
 if(graded)sx.filter=(filt({...FX,...(c.fx||{})})+svgF(c)).trim()||'none';
 sx.drawImage(src,0,0,64,36);sx.filter='none';if(v){v.removeAttribute('src');v.load()}
 return sx.getImageData(0,0,64,36).data}
function stats(d){const n=d.length/4,H=new Array(256).fill(0);let r=0,g_=0,b=0,l=0,l2=0,sa=0;
 for(let i=0;i<d.length;i+=4){const R=d[i]/255,G=d[i+1]/255,B=d[i+2]/255,L=.2126*R+.7152*G+.0722*B,mx=Math.max(R,G,B),mn=Math.min(R,G,B);r+=R;g_+=G;b+=B;l+=L;l2+=L*L;sa+=mx?(mx-mn)/mx:0;H[Math.round(L*255)]++}
 const pc=p=>{let a=0;for(let i=0;i<256;i++){a+=H[i];if(a>=p*n)return i/255}return 1};
 const ml=l/n;return{ch:[r/n,g_/n,b/n],l:ml,sd:Math.sqrt(Math.max(1e-6,l2/n-ml*ml)),sat:sa/n,p1:pc(.01),p99:pc(.99)}}
/* --- writing the result into the clip --- */
const CLp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setBal(c,gn){const m=(gn[0]+gn[1]+gn[2])/3,N=gn.map(v=>CLp(2*(v/m-1),-1,1)),P=[0,2.0944,-2.0944];
 let x=0,y=0;N.forEach((v,i)=>{x+=2/3*v*Math.cos(P[i]);y+=2/3*v*Math.sin(P[i])});const r=Math.hypot(x,y);if(r>1){x/=r;y/=r}
 c.wh=c.wh||defWh();c.wh.gain.x=+x.toFixed(3);c.wh.gain.y=+y.toFixed(3)}
function put(c,o){c.fx=c.fx||{...FX};Object.assign(c.fx,o.fx);if(ngA(c)){NGN++;return}if(o.gn)setBal(c,o.gn)}
function done(){try{ctSync()}catch(x){}try{fxui()}catch(x){}try{tl()}catch(x){}draw()}
let NGN=0;const ngNote=()=>NGN?' · '+NGN+' with Node Graph: brightness/contrast/saturation applied (before the graph), balance unchanged — adjust it in the Wheels':'';
const usable=a=>{NGN=0;return a.filter(c=>!c.m.tx&&(c.m.v||c.m.img))};
/* Shot Match: fits mean/contrast/saturation/balance to a reference (the reference is taken already with its grade) */
async function match(){if(!ref||!clips.includes(ref)){toast('Set a reference first');return}
 const tg=usable(S().filter(c=>c!==ref));if(!tg.length){toast('Select clip(s) to match');return}
 try{const R=stats(await frame(ref,true));
  for(const c of tg){const A=stats(await frame(c,false)),q=R.sd/A.sd,cc=CLp(1+2*q*A.l-2*R.l,.5,1.8),k=CLp(q/cc,.4,2.5);
   put(c,{fx:{b:Math.round(k*100),c:Math.round(cc*100),s:Math.round(CLp(100*R.sat/Math.max(.02,A.sat),30,200))},gn:A.ch.map((v,i)=>(R.ch[i]/R.l)/(v/A.l))})}
  done();toast('Shot Match: '+tg.length+' clip(s) matched to “'+ref.m.n+'”'+ngNote())}catch(e){toast('Shot Match: could not read the frame')}}
/* Auto Color: black/white point stretch, gray world, soft saturation; strength 0.8 */
async function auto(){const tg=usable(S());if(!tg.length){toast('Select clip(s)');return}const K=.8;
 try{for(const c of tg){const A=stats(await frame(c,false)),sl=CLp(1/Math.max(.2,A.p99-A.p1),1,2.2),cc=CLp(1+2*A.p1*sl,1,1.6),k=CLp(sl/cc,.6,2),mu=(A.ch[0]+A.ch[1]+A.ch[2])/3;
  put(c,{fx:{b:Math.round(100*(1+(k-1)*K)),c:Math.round(100*(1+(cc-1)*K)),s:Math.round(CLp(100*.38/Math.max(.05,A.sat),90,130))},gn:A.ch.map(v=>1+(mu/v-1)*K)})}
  done();toast('Auto Color: '+tg.length+' clip(s).'+ngNote())}catch(e){toast('Auto Color: could not read the frame')}}
/* --- UI (Color tab, under the "Group" block) --- */
const st=document.createElement('style');st.textContent='body:not([data-p=color]) #tgp{display:none}#tgp{margin:6px 0;border-top:1px solid var(--bd);padding-top:6px}#tgp summary{cursor:pointer;font-weight:600;font-size:12px}#tgp .r{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}';document.head.append(st);
const P=document.createElement('div');P.id='tgp';
const SL=[['b','Exposure',0,200],['c','Contrast',0,200],['s','Saturation',0,200],['h','Hue',-180,180],['w','Warmth',0,100],['gr','B/W',0,100]];
P.innerHTML=`<details open><summary>Timeline Grade</summary><div class=r><label style="display:inline-flex;gap:6px;margin:0"><input type=checkbox id=tgo>On</label><button class=btn id=tgc>From clip</button><button class=btn id=tgr>Reset</button></div><div id=tgs></div></details><div style="font-size:12px;font-weight:600;margin-top:10px">Shot Match · Auto Color</div><div class=r><button class=btn id=smr>Reference</button><button class=btn id=smm>Match</button><button class=btn id=aca>Auto Color</button></div><div id=sml style="font-size:11px;color:var(--mu)"></div>`;
$('#insp').insertBefore(P,$('#fup'));
const sl=Q('#tgs');
SL.forEach(([k,n,a,b])=>{const l=document.createElement('label');l.innerHTML=`${n}<span></span>`;const r=document.createElement('input');r.type='range';r.min=a;r.max=b;r.dataset.k=k;r.oninput=()=>{TG[k]=+r.value;l.lastChild.textContent=r.value;sv();draw()};r.ondblclick=()=>{r.value=TG[k]=DEF[k];r.oninput()};sl.append(l,r)});
function sync(){Q('#tgo').checked=TG.on;sl.querySelectorAll('input').forEach(r=>{r.value=TG[r.dataset.k];r.previousSibling.lastChild.textContent=r.value});Q('#sml').textContent=ref&&clips.includes(ref)?'Reference: '+ref.m.n:'No reference set'}
Q('#tgo').onchange=e=>{TG.on=e.target.checked;sv();draw()};
Q('#tgr').onclick=()=>{TG={...DEF,on:TG.on};sv();sync();draw()};
Q('#tgc').onclick=()=>{if(!sel||!sel.fx){toast('Select a clip');return}['b','c','s','h','w','gr'].forEach(k=>TG[k]=sel.fx[k]??DEF[k]);sv();sync();draw()};
Q('#smr').onclick=()=>{if(!sel||!clips.includes(sel)){toast('Select the reference clip');return}ref=sel;sync()};
Q('#smm').onclick=match;Q('#aca').onclick=auto;sync();
})();
</script>
